<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


     <style>
    *{
        margin:0;
        padding:0;
        box-sizing:boder-box;
    }
    body{
        font-family:arial,sans-serif;
        background-color:#f4f4f4;
        color:#333;
        line-height:1.6;
    }
    header{
        font-size:36px;
        margin-bottom:5ox;
    }
    nav{
        background-color:#e63946;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:25px;
        padding:12px;
    }
    nav a{
        color:white;
        text-decoration:none;
        font-weight:bold;

    }
    nav a:hover{
        color:#ffd166;
    }
    main{
        max-width:1100px;
        margin:25px auto;
        padding:0 20px;
    }
    .featured{
        background-color:white;
        margin-bottom:35px;
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 2ox 8px #00000015;
    }
    .futured img{
        width:100%;
        width:350px;
        object-fit:cover;
        display:block
    }
    .feature-text{
        padding:25px;
    }
    .featured-text h2{
        color:#14213d;
        margin-bottom:10px
    }
    .feature-text a,
    .news-card a{
        display:inline-block;
        color:#e63946;
        text-decoration:none;
        font-weight:bold;
        margin:12px;
    }
    .feature-text a:hover,
    .news-card a:hover{
        text-decoration:none;
    }
    .latest-news h2{
        margin-bottom:20px;
        color:#14213d;
    }
    .mew-container{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:20px;
    }
    .news-card{
        background-color:white;
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 2px 8px #00000015;
        transition:0.3s;
    }.news-card:hover{
        transform:translate y(-5px);
    }
    .news-card img{
        width:100%;
        height:180px;
        object-fit:cover;
        display:block;
    }
    .card-content span{
        color:#e63946;
        font-size:13px;
        font-weight:bold;
        text-transform:uppercase;
    }
    .card-content{
        margin:8px 0;
        color:#14213d;
    }
    footer{
        background-color:#14213d;
        color:white;
        text-align:center;
        padding:20px;
        margin-top:40px;
    }
    @media(max-width:768){
        .news-container{
            grid-template-columns:1fr;
    }
    .feature img{
        height:220px;
    }
    hearder h1{
        font-size:28px;
    }nav{
        gap:15px;
    }}
    button{
        background-color: rgb(58, 58, 182);
        border-radius: 7px;
    }
    button a{
        text-decoration: none;
        color: white;
    }
</style>
<body>
    <button><a href="home.html">home</a></button>
  <main>
  
    

      <section class="featured">
    <img src="images (1).jpeg"alt=featured news>
    <div class="feature-text">
        <h2>breaking news:a new day begins</h2>
        <p>stay informed with the latest event happing around the wold</p>
       
    </div>
</section>  
    </main>

        <p>stay informed with the latest event happing around the wold</p>

    </main>
</body>
</html>
